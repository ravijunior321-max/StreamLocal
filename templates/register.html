{% extends "base.html" %}

{% block title %}Créer un compte - StreamLocal{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Créer ton compte</h1>

            <p>
                Rejoins la communauté StreamLocal.
            </p>

        </div>

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">

                <label>
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Ex : ravi_junior"
                    minlength="3"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Adresse email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="exemple@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Numéro de téléphone
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="2376XXXXXXXX"
                >

            </div>

            <div class="form-group">

                <label>
                    Mot de passe
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Minimum 8 caractères"
                    minlength="8"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Confirmer le mot de passe
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Retape ton mot de passe"
                    minlength="8"
                    required
                >

            </div>

            <button
                type="submit"
                class="primary-button full-width"
            >
                Créer mon compte
            </button>

        </form>

        <p class="auth-footer">

            Tu as déjà un compte ?

            <a href="{{ url_for('login') }}">
                Se connecter
            </a>

        </p>

    </div>

</div>

{% endblock %}
